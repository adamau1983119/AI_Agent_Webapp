        var path = location.pathname
        var lang = path === '/en' || path.indexOf('/en/') === 0 ? 'en' : path === '/ja' || path.indexOf('/ja/') === 0 ? 'ja' : null
        if (!lang) return
        try {
          localStorage.setItem('preferred-language', lang)
          localStorage.setItem('i18n-storage', JSON.stringify({ state: { language: lang }, version: 0 }))
        } catch (e) {}
        document.documentElement.lang = lang
      })()
    </script>
