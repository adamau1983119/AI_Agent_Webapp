# 正式域日報：Railway Hobby 擋 SMTP，改由 GitHub Actions 寄（本機／Gmail 已驗證可通）
# 08:00 HKT = 00:00 UTC；Secrets：GMAIL_USER、GMAIL_APP_PASSWORD、OBS_OPS_EMAIL
name: Obs Daily Digest

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal mail deps
        run: |
          python -m pip install --upgrade pip
          pip install "aiosmtplib>=3.0.0" "python-dotenv>=1.0.1" \
            "pydantic>=2.10.0" "pydantic-settings>=2.6.0" \
            "httpx>=0.27.0" "email-validator>=2.1.0"

      - name: Send daily digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OBS_OPS_EMAIL: ${{ secrets.OBS_OPS_EMAIL }}
          OBS_DAILY_DIGEST_ENABLED: "true"
          OBS_ALERT_EMAIL_SEND: "true"
        run: python scripts/send_obs_daily_digest_now.py
